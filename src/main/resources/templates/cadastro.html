<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos :: metas('Cadastro · Roleta do Saber')}"></th:block>
</head>
<body class="pagina-acesso">
<div th:replace="~{fragmentos :: cenario}"></div>

<div class="hud hud-esquerda">
    <p class="hud-ajuda">Crie sua conta: você começa com R$ 1.000 e cada ticket custa R$ 200.</p>
</div>

<div class="palco" aria-hidden="true">
    <div class="roleta-moldura">
        <div id="roleta-decorativa" class="roleta roleta-decorativa"></div>
    </div>
</div>
<ul id="premios-decorativos" hidden>
    <li th:each="p : ${premios}" th:data-tipo="${p.tipo}" th:text="${p.rotulo}"></li>
</ul>

<main class="menu">
    <header class="menu-banner">
        <span class="marca-script">Roleta</span>
        <span class="marca-sub">do Saber</span>
    </header>
    <nav class="menu-abas">
        <a class="aba" th:href="@{/login}">Entrar</a>
        <a class="aba ativa" th:href="@{/cadastro}" aria-current="page">Criar conta</a>
    </nav>

    <p th:if="${erroGeral}" class="menu-mensagem" th:text="${erroGeral}"></p>

    <form th:action="@{/cadastro}" th:object="${form}" method="post" novalidate>
        <label class="linha linha-campo">
            <span>Usuário</span>
            <input th:field="*{username}" type="text" autocomplete="username" required maxlength="30"
                   pattern="[a-zA-Z0-9_.]{3,30}">
        </label>
        <p class="menu-mensagem" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        <label class="linha linha-campo">
            <span>Senha</span>
            <input th:field="*{senha}" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
        </label>
        <p class="menu-mensagem" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></p>
        <label class="linha linha-campo">
            <span>Confirmar senha</span>
            <input th:field="*{confirmacaoSenha}" type="password" autocomplete="new-password" required minlength="8"
                   maxlength="72">
        </label>
        <p class="menu-mensagem" th:if="${#fields.hasErrors('confirmacaoSenha')}" th:errors="*{confirmacaoSenha}"></p>
        <button type="submit" class="linha linha-acao"><span>Criar conta</span><b>›</b></button>
    </form>
    <p class="menu-descricao">Usuário: 3 a 30 caracteres (letras, números, ponto ou _). Senha: mínimo de 8 caracteres.</p>
</main>
<script th:src="@{/js/roleta.js}"></script>
<script th:src="@{/js/acesso.js}"></script>
</body>
</html>
