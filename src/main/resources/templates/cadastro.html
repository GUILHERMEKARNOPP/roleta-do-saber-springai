<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos :: metas('Cadastro · Roleta do Saber')}"></th:block>
</head>
<body class="pagina-acesso">
<div th:replace="~{fragmentos :: cenario}"></div>

<main class="cartao-acesso">
    <div class="marca">
        <span class="marca-estrelas">✦ ✦ ✦</span>
        <span class="marca-script">Roleta</span>
        <span class="marca-sub">DO SABER</span>
    </div>
    <p class="chamada">Crie sua conta e comece com <strong>R$ 1.000</strong>. Cada ticket custa R$ 200.</p>

    <div th:if="${erroGeral}" class="alerta erro" th:text="${erroGeral}"></div>

    <form th:action="@{/cadastro}" th:object="${form}" method="post" class="formulario" novalidate>
        <label for="username">Usuário</label>
        <input id="username" th:field="*{username}" type="text" autocomplete="username" required
               maxlength="30" pattern="[a-zA-Z0-9_.]{3,30}">
        <small class="erro-campo" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>

        <label for="senha">Senha</label>
        <input id="senha" th:field="*{senha}" type="password" autocomplete="new-password" required
               minlength="8" maxlength="72">
        <small class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>

        <label for="confirmacaoSenha">Confirme a senha</label>
        <input id="confirmacaoSenha" th:field="*{confirmacaoSenha}" type="password" autocomplete="new-password"
               required minlength="8" maxlength="72">
        <small class="erro-campo" th:if="${#fields.hasErrors('confirmacaoSenha')}"
               th:errors="*{confirmacaoSenha}"></small>

        <button type="submit" class="botao botao-principal">Criar conta</button>
    </form>
    <p class="rodape-acesso">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
</main>

<script th:src="@{/js/cenario.js}"></script>
</body>
</html>
