<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="metas(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Roleta do Saber</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</th:block>
</head>
<body>

<!-- Interior do cassino: parede, letreiro, cristais, pilares de mármore, caça-níqueis e carpete -->
<div th:fragment="cenario" class="cassino" aria-hidden="true">
    <div class="parede"></div>
    <div class="teto"></div>
    <div class="cristais"></div>
    <div class="letreiro">MESAS DE JOGO</div>

    <svg class="pilar pilar-esquerdo" viewBox="0 0 140 800" preserveAspectRatio="none" focusable="false">
        <defs>
            <filter id="marmore" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.13 0.07" numOctaves="3" seed="11" result="ruido"/>
                <feColorMatrix in="ruido" type="matrix"
                               values="0 0 0 0 0.04  0 0 0 0 0.06  0 0 0 0 0.1  -26 0 0 0 10.6"/>
            </filter>
            <filter id="marmore-azul" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.09 0.05" numOctaves="2" seed="4" result="ruido"/>
                <feColorMatrix in="ruido" type="matrix"
                               values="0 0 0 0 0.2  0 0 0 0 0.42  0 0 0 0 0.78  -30 0 0 0 11.9"/>
            </filter>
            <linearGradient id="pilar-volume" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#000" stop-opacity="0.65"/>
                <stop offset="0.28" stop-color="#000" stop-opacity="0.05"/>
                <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
                <stop offset="0.78" stop-color="#000" stop-opacity="0.12"/>
                <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
            </linearGradient>
        </defs>
        <rect width="140" height="800" fill="#e8edf3"/>
        <rect width="140" height="800" filter="url(#marmore)"/>
        <rect width="140" height="800" filter="url(#marmore-azul)"/>
        <rect width="140" height="800" fill="url(#pilar-volume)"/>
    </svg>
    <svg class="pilar pilar-direito" viewBox="0 0 140 800" preserveAspectRatio="none" focusable="false">
        <rect width="140" height="800" fill="#e8edf3"/>
        <rect width="140" height="800" filter="url(#marmore)" transform="scale(-1 1) translate(-140 0)"/>
        <rect width="140" height="800" filter="url(#marmore-azul)"/>
        <rect width="140" height="800" fill="url(#pilar-volume)"/>
    </svg>

    <div class="maquinas maquinas-esquerda"></div>
    <div class="maquinas maquinas-direita"></div>
    <div class="piso"></div>
    <div class="vinheta"></div>
</div>

<!-- Pedestal de mármore preto e gemas iluminadas na base da roleta -->
<th:block th:fragment="base-roleta">
    <div class="pedestal" aria-hidden="true"></div>
    <svg class="gemas" viewBox="0 0 1000 300" aria-hidden="true" focusable="false">
        <defs>
            <radialGradient id="gema-luz" cx="45%" cy="35%" r="75%">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="0.55" stop-color="#e6f4ff"/>
                <stop offset="1" stop-color="#a9d2f5"/>
            </radialGradient>
            <g id="gema">
                <path class="gema-corpo" d="M60,0 L140,0 L200,40 L100,140 L0,40 Z"/>
                <path class="gema-faceta" d="M0,40 L200,40 M60,0 L40,40 M60,0 L80,40 M100,0 L80,40 M100,0 L120,40
                         M140,0 L120,40 M140,0 L160,40 M40,40 L100,140 M80,40 L100,140 M120,40 L100,140 M160,40 L100,140
                         M30,20 L50,40 M170,20 L150,40"/>
            </g>
        </defs>
        <use href="#gema" transform="translate(20,120) rotate(-24 100 70) scale(1.35)"/>
        <use href="#gema" transform="translate(205,175) rotate(14 100 70) scale(0.8)"/>
        <use href="#gema" transform="translate(-30,200) rotate(-6 100 70) scale(0.6)"/>
        <use href="#gema" transform="translate(690,105) rotate(22 100 70) scale(1.45)"/>
        <use href="#gema" transform="translate(590,180) rotate(-16 100 70) scale(0.85)"/>
        <use href="#gema" transform="translate(860,205) rotate(8 100 70) scale(0.62)"/>
    </svg>
</th:block>

</body>
</html>
