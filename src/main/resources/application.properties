spring.application.name=roleta-do-saber

# ---------- Banco de dados (H2 em arquivo, salvo em ./data) ----------
spring.datasource.url=jdbc:h2:file:./data/roleta
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2 (desligado por padrao; ligue com H2_CONSOLE=true so na sua maquina).
# Mesmo ligado, so aceita acesso de localhost.
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------- IA: OpenRouter (API compativel com OpenAI) ----------
# A chave NUNCA fica no codigo: defina a variavel de ambiente OPENROUTER_API_KEY.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:sem-chave-configurada}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# "openrouter/free" escolhe automaticamente um modelo gratuito disponivel.
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openrouter/free}
spring.ai.openai.chat.options.temperature=0.9
spring.ai.openai.chat.options.timeout=90s
spring.ai.openai.chat.options.max-retries=1
spring.ai.openai.custom-headers.X-Title=Roleta do Saber
# So usamos chat; desliga os outros modelos do starter.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ---------- Web / seguranca ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em producao (HTTPS) use COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Remove a coluna xp de bancos criados por versoes antigas (idempotente, sem perda de dados).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
