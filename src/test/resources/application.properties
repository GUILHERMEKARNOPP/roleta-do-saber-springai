spring.datasource.url=jdbc:h2:mem:roleta-teste;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Chave falsa: os testes nunca chamam a IA de verdade (o gerador e mockado).
spring.ai.openai.api-key=chave-de-teste
spring.ai.openai.base-url=http://localhost:9/v1
spring.ai.openai.chat.options.model=modelo-de-teste
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
